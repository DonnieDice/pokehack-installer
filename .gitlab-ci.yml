stages: [test, build]

variables:
  EXPO_TELEMETRY_DISABLED: "1"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

unit-tests:
  stage: test
  image: node:20-bookworm
  cache:
    key:
      files:
        - package.json
    paths:
      - node_modules/
  script:
    - npm install --no-audit --no-fund
    - npx jest --ci

web-export:
  stage: build
  image: node:20-bookworm
  cache:
    key:
      files:
        - package.json
    paths:
      - node_modules/
  script:
    - npm install --no-audit --no-fund
    - npx expo install react-native-web react-dom @expo/metro-runtime
    - npx expo export --platform web
  artifacts:
    name: "web-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/
    expire_in: 1 week
  allow_failure: true

android-debug-apk:
  stage: build
  image: mingc/android-build-box:latest
  tags: [android]
  cache:
    key:
      files:
        - package.json
    paths:
      - node_modules/
      - .gradle/
  script:
    - npm install --no-audit --no-fund
    - npx expo prebuild -p android --no-install
    - cd android && ./gradlew assembleDebug --no-daemon
  artifacts:
    name: "apk-${CI_COMMIT_SHORT_SHA}"
    paths:
      - android/app/build/outputs/apk/debug/*.apk
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Signed release APK, built only on main (protected+masked CI variables
# exist only on protected branches, so the main-only rule also guarantees
# the variables are available to this job; see issue #10 for the
# operator-held variable setup).
android-release-apk:
  stage: build
  image: mingc/android-build-box:latest
  tags: [android]
  cache:
    key:
      files:
        - package.json
    paths:
      - node_modules/
      - .gradle/
  script:
    - npm install --no-audit --no-fund
    # Fail closed with a clear message when the operator has not set the
    # four protected signing variables yet. Never echo variable values.
    - |
      if [ -z "${ANDROID_KEYSTORE_B64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
        echo "FATAL: android-release-apk requires the protected CI variables ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. They are not set (or not visible to this pipeline). An operator must create them as protected+masked variables scoped to protected branches in Settings -> CI/CD -> Variables. Refusing to produce an unsigned release artifact; see issue #10."
        exit 1
      fi
    - npx expo prebuild -p android --no-install
    # Decode the keystore into the prebuild output directory (never committed;
    # android/ is gitignored and generated fresh in this job).
    - echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/upload.jks
    # Patch the generated build.gradle to add a release signing config fed
    # from the environment. android/ is generated by prebuild in this job and
    # never committed (see .gitignore).
    - |
      python3 - <<'PYEOF'
      import sys
      path = 'android/app/build.gradle'
      with open(path) as f:
          gradle = f.read()
      # 1. Insert a release signingConfig fed from the four protected
      #    environment variables, anchored on the debug-only signingConfigs
      #    block Expo generates so the replacement is unambiguous.
      debug_block = (
          "    signingConfigs {\n"
          "        debug {\n"
          "            storeFile file('debug.keystore')\n"
          "            storePassword 'android'\n"
          "            keyAlias 'androiddebugkey'\n"
          "            keyPassword 'android'\n"
          "        }\n"
          "    }\n"
      )
      release_cfg = (
          "        release {\n"
          "            storeFile file('upload.jks')\n"
          '            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
          '            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n'
          '            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n'
          "        }\n"
      )
      if debug_block not in gradle:
          sys.exit('FATAL: expected Expo signingConfigs debug block not found in ' + path)
      gradle = gradle.replace(
          debug_block,
          debug_block[:-len('    }\n')] + release_cfg + '    }\n', 1)
      # 2. Point the release buildType at the env-fed release config.
      #    Anchor on the release block's caution comment so the debug
      #    buildType's own signingConfig line is never touched.
      release_prefix = (
          "        release {\n"
          "            // Caution! In production, you need to generate your own keystore file.\n"
          "            // see https://reactnative.dev/docs/signed-apk-android.\n"
      )
      debug_marker = '            signingConfig signingConfigs.debug'
      if release_prefix + debug_marker not in gradle:
          sys.exit('FATAL: expected release buildType signingConfig line not found in ' + path)
      gradle = gradle.replace(
          release_prefix + debug_marker,
          release_prefix + '            signingConfig signingConfigs.release', 1)
      # 3. First signed release keeps minify/shrink off (no proguard
      #    mapping/R8 config work in scope; documented in the MR).
      gradle = gradle.replace('minifyEnabled enableProguardInReleaseBuilds',
                              'minifyEnabled false', 1)
      gradle = gradle.replace(
          "shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)",
          'shrinkResources false', 1)
      with open(path, 'w') as f:
          f.write(gradle)
      print('release signing config injected into ' + path)
      PYEOF
    - cd android && ./gradlew assembleRelease --no-daemon
  artifacts:
    name: "release-apk-${CI_COMMIT_SHORT_SHA}"
    paths:
      - android/app/build/outputs/apk/release/*.apk
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
